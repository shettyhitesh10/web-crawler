name: Ghibli colour POC
on:
  push:
    branches: [ghibli-colour-poc]
    paths:
      - 'ghibli-poc/**'
      - '.github/workflows/ghibli-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy requests
      - name: Fetch and classify official stills
        run: python ghibli-poc/poc.py
      - name: Preserve POC files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghibli-colour-poc
          path: ghibli-poc/output/
          if-no-files-found: warn
          retention-days: 7
