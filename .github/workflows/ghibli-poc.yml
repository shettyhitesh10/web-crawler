name: Ghibli colour POC
on:
  push:
    branches: [ghibli-colour-poc]
    paths:
      - 'ghibli-poc/**'
      - '.github/workflows/ghibli-poc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy requests
      - name: Fetch and classify official stills
        run: python ghibli-poc/poc.py
      - name: Preserve POC files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghibli-colour-poc
          path: ghibli-poc/output/
          if-no-files-found: warn
          retention-days: 7
      - name: Save URL and hash checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghibli-poc/progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Checkpoint Ghibli classification state [skip ci]"
            git push origin HEAD:ghibli-colour-poc
          fi
